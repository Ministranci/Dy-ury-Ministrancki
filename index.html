<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafik Dyżurów Ministrantów</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e3c72;
            --secondary-color: #2a5298;
            --accent-color: #f39c12;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); color: white; padding: 30px; border-radius: 12px; text-align: center; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; }
        header h1 { font-size: 2.2rem; margin-bottom: 5px; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 30px; }
        h2 { font-size: 1.4rem; margin-bottom: 20px; color: var(--primary-color); border-bottom: 2px solid var(--bg-color); padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; outline: none; }
        button { background-color: var(--accent-color); color: white; border: none; padding: 12px 20px; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; }
        button:hover { background-color: #d68910; }
        .filters { display: flex; gap: 10px; margin-bottom: 20px; }
        .filters select { flex: 1; }
        .duty-list { display: grid; gap: 15px; }
        .duty-item { background: #fafafa; border-left: 5px solid var(--secondary-color); padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .duty-info h3 { font-size: 1.1rem; color: var(--primary-color); }
        .delete-btn { background-color: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; display: none; } 
        .delete-btn.visible { display: inline-block; }
        .delete-btn:hover { background-color: #c0392b; }
        .loading { text-align: center; color: #666; font-style: italic; }
        
        .admin-panel {
            text-align: right;
            margin-bottom: 15px;
        }
        .admin-toggle {
            background: none;
            border: none;
            color: var(--secondary-color);
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: underline;
            width: auto;
            padding: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🕯️ Grafik Dyżurów Ministrantów</h1>
            <p>Wspólny grafik w czasie rzeczywistym</p>
        </header>

        <div class="card">
            <h2>Zapisz się na dyżur</h2>
            <form id="dutyForm">
                <div class="form-group">
                    <label for="ministrantName">Imię i nazwisko ministranta:</label>
                    <input type="text" id="ministrantName" required placeholder="np. Jan Kowalski">
                </div>
                <div class="form-group">
                    <label for="dayOfWeek">Dzień tygodnia:</label>
                    <select id="dayOfWeek" required>
                        <option value="Poniedziałek">Poniedziałek</option>
                        <option value="Wtorek">Wtorek</option>
                        <option value="Środa">Środa</option>
                        <option value="Czwartek">Czwartek</option>
                        <option value="Piątek">Piątek</option>
                        <option value="Sobota">Sobota</option>
                        <option value="Niedziela">Niedziela</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="massTime">Godzina Mszy Świętej:</label>
                    <input type="text" id="massTime" required placeholder="np. 18:00">
                </div>
                <button type="submit" id="submitBtn">Zapisz dyżur</button>
            </form>
        </div>

        <div class="card">
            <div class="admin-panel">
                <button class="admin-toggle" id="adminToggleBtn">Tryb administratora (Usuwanie)</button>
            </div>

            <h2>Aktualny grafik</h2>
            <div class="filters">
                <select id="filterDay">
                    <option value="Wszystkie">Wszystkie dni</option>
                    <option value="Poniedziałek">Poniedziałek</option>
                    <option value="Wtorek">Wtorek</option>
                    <option value="Środa">Środa</option>
                    <option value="Czwartek">Czwartek</option>
                    <option value="Piątek">Piątek</option>
                    <option value="Sobota">Sobota</option>
                    <option value="Niedziela">Niedziela</option>
                </select>
            </div>
            <div id="dutyList" class="duty-list">
                <div class="loading">Ładowanie grafiku z chmury...</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfiguracja projektu Firebase (Projekt Ministranci)
        const firebaseConfig = {
            apiKey: "sb_publishable_CfYsQVTvAmERvdT53vtmvg_ifd7ejAS",
            authDomain: "hbkokfqsaemxofjwqcob.firebaseapp.com",
            projectId: "hbkokfqsaemxofjwqcob",
            storageBucket: "hbkokfqsaemxofjwqcob.appspot.com",
            messagingSenderId: "ministranci",
            appId: "ministranci-app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const dutyForm = document.getElementById('dutyForm');
        const dutyList = document.getElementById('dutyList');
        const filterDay = document.getElementById('filterDay');
        const submitBtn = document.getElementById('submitBtn');
        const adminToggleBtn = document.getElementById('adminToggleBtn');

        let allDuties = [];
        let isAdmin = false; 
        const ADMIN_PASSWORD = "123"; // Hasło administratora do usuwania dyżurów

        adminToggleBtn.addEventListener('click', () => {
            if (!isAdmin) {
                const pass = prompt("Wpisz hasło administratora:");
                if (pass === ADMIN_PASSWORD) {
                    isAdmin = true;
                    adminToggleBtn.textContent = "Wyloguj tryb admina";
                    alert("Zalogowano pomyślnie! Przyciski usuwania są teraz widoczne.");
                    renderDuties();
                } else if (pass !== null) {
                    alert("Błędne hasło!");
                }
            } else {
                isAdmin = false;
                adminToggleBtn.textContent = "Tryb administratora (Usuwanie)";
                alert("Wylogowano z trybu administratora.");
                renderDuties();
            }
        });

        onSnapshot(collection(db, "duties"), (snapshot) => {
            allDuties = [];
            snapshot.forEach((docSnap) => {
                allDuties.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderDuties();
        });

        dutyForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = "Zapisywanie...";

            const name = document.getElementById('ministrantName').value.trim();
            const day = document.getElementById('dayOfWeek').value;
            const time = document.getElementById('massTime').value.trim();

            try {
                await addDoc(collection(db, "duties"), { name, day, time, createdAt: Date.now() });
                dutyForm.reset();
            } catch (error) {
                alert("Błąd podczas zapisywania: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Zapisz dyżur";
            }
        });

        window.deleteDuty = async function(id) {
            if (!isAdmin) {
                alert("Brak uprawnień!");
                return;
            }
            if (confirm('Czy na pewno chcesz usunąć ten dyżur?')) {
                try {
                    await deleteDoc(doc(db, "duties", id));
                } catch (error) {
                    alert("Błąd podczas usuwania: " + error.message);
                }
            }
        };

        function renderDuties() {
            const selectedFilter = filterDay.value;
            dutyList.innerHTML = '';

            const filtered = allDuties.filter(duty => {
                if (selectedFilter === 'Wszystkie') return true;
                return duty.day === selectedFilter;
            });

            if (filtered.length === 0) {
                dutyList.innerHTML = '<div class="loading">Brak zaplanowanych dyżurów.</div>';
                return;
            }

            filtered.forEach(duty => {
                const item = document.createElement('div');
                item.className = 'duty-item';
                
                const deleteBtnClass = isAdmin ? 'delete-btn visible' : 'delete-btn';

                item.innerHTML = `
                    <div class="duty-info">
                        <h3>${escapeHtml(duty.name)}</h3>
                        <p>📅 <strong>${escapeHtml(duty.day)}</strong> | ⏰ ${escapeHtml(duty.time)}</p>
                    </div>
                    <button class="${deleteBtnClass}" onclick="deleteDuty('${duty.id}')">Usuń</button>
                `;
                dutyList.appendChild(item);
            });
        }

        filterDay.addEventListener('change', renderDuties);

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
